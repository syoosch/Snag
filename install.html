<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snag</title>
  <link rel="icon" type="image/svg+xml" href="img/brand.svg">
  <link rel="stylesheet" href="css/brand.css">
  <link rel="stylesheet" href="css/install.css">
  <script defer src="js/function.js"></script>
  <script defer src="js/install.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="wordmark"><img src="img/brand.svg" alt="" width="36" height="36"><span data-copy="extensionName"></span></div>
    <select id="language" aria-label="界面语言 / Language">
      <option value="zh_CN" lang="zh-CN">简体中文</option>
      <option value="zh_TW" lang="zh-TW">繁體中文</option>
      <option value="en" lang="en">English</option>
    </select>
  </header>

  <main class="welcome">
    <section class="intro" aria-labelledby="headline">
      <h1 id="headline" data-copy="welcomeInstalled"></h1>
      <ol class="steps">
        <li id="first-step" data-copy="welcomeOpen"></li>
        <li id="save-step" data-copy="welcomeSave"></li>
      </ol>
      <button id="agreeBtn" class="primary" type="button">
        <span data-copy="welcomeAgree"></span>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>
      </button>
      <p class="note" id="agreement" data-copy="welcomeAgreement"></p>
      <p class="note" id="panel-error" role="status" hidden data-copy="welcomePanelFailed"></p>
    </section>

    <figure class="sample">
      <div class="sample-stage" aria-hidden="true">
        <div class="viewfinder"><img src="img/brand.svg" alt="" width="160" height="160"></div>
      </div>
      <figcaption>
        <div><h2 data-copy="welcomeSample"></h2><span class="file-meta">PNG · 128 × 128</span></div>
        <a class="sample-save" href="img/icon128.png" download="Snag.png">
          <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 16v4h14v-4"/></svg>
          <span data-copy="welcomeTry"></span>
        </a>
      </figcaption>
    </figure>
  </main>

  <footer>
    <details class="fine-print">
      <summary data-copy="welcomeTerms"></summary>
      <p data-copy="welcomePrivacy"></p>
      <p data-copy="welcomeOnlineMedia"></p>
      <p data-copy="welcomeSharing"></p>
      <p data-copy="welcomeUsage"></p>
    </details>
    <div class="credits">
      <a href="options.html#anchorAbout" target="_blank" rel="noopener noreferrer" data-copy="about"></a>
      <button type="button" id="uninstallBtn" data-copy="welcomeUninstall"></button>
    </div>
  </footer>
</body>
</html>
