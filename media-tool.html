<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n-title="mediaLocalTool">FFmpeg</title><link rel="icon" href="img/brand.svg">
<link rel="stylesheet" href="css/brand.css"><link rel="stylesheet" href="css/sidebar.css">
<script defer src="js/polyfill.js"></script><script defer src="js/i18n.js"></script><script defer src="js/media-tool.js"></script>
</head><body><main><h1 data-i18n="mediaLocalTool"></h1>
<label id="file-label"><span data-i18n="mediaPickFiles"></span> <input id="files" type="file" accept="video/*,audio/*,.m4s,.ts,.mkv" multiple></label>
