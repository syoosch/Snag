<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n-title="extensionName">Snag</title>
  <link rel="icon" href="img/brand.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/brand.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <script defer src="js/polyfill.js"></script>
  <script defer src="js/function.js"></script>
  <script defer src="js/init.js"></script>
  <script defer src="js/templates.js"></script>
  <script defer src="lib/base64.js"></script>
  <script defer src="js/popup-utils.js"></script>
  <script defer src="lib/hls.min.js"></script>
  <script defer src="js/sidebar-bili.js"></script>
  <script defer src="js/media-formats.js"></script>
  <script defer src="js/media-sources.js"></script>
  <script defer src="js/sidebar-player.js"></script>
  <script defer src="js/sidebar-catalog.js"></script>
  <script defer src="js/i18n.js"></script>
  <script defer src="js/sidebar-preview.js"></script>
  <script defer src="js/media-panel.js"></script>
  <script defer src="js/sidebar-quality.js"></script>
  <script defer src="js/sidebar-metadata.js"></script>
  <script defer src="js/sidebar.js"></script>
</head>
<body>
  <header>
    <div class="heading">
      <label class="sr-only" for="scope" data-i18n="currentPage"></label>
      <select id="scope"><button type="button"><selectedcontent></selectedcontent></button></select>
      <details id="more">
        <summary><span class="sr-only" data-i18n="moreFeatures"></span><span aria-hidden="true">•••</span></summary>
        <div class="menu">
          <a href="install.html?guide" target="_blank" rel="noopener" data-i18n="welcomeGuide"></a>
          <button id="tools" data-i18n="playbackTitle"></button>
          <button id="settings" data-i18n="settings"></button>
        </div>
      </details>
    </div>
  </header>
  <main>
    <div class="command-row">
      <h1 data-i18n="sideResources"></h1>
      <div class="action-row">
        <button id="rescan" aria-live="polite" data-i18n="sideRescan" disabled></button>
        <button id="reload-page" data-i18n="sideReloadCapture" disabled></button>
        <button id="pick" class="picker" aria-pressed="false" data-i18n="sidePick" disabled></button>
      </div>
    </div>
    <div class="filter-row">
      <div id="filters" class="filters" role="group"></div>
      <button id="multi" class="text-btn" aria-pressed="false" data-i18n="sideMulti"></button>
    </div>
    <div id="selection-tools" class="list-tools" hidden>
      <span data-i18n="sideChosen"></span>
      <button id="back" class="text-btn" data-i18n="sideBack"></button>
    </div>
    <p id="status" role="status"></p>
    <section id="media-tasks" hidden><h3 data-i18n="mediaTasks"></h3><div></div></section>
    <p id="empty" hidden></p>
    <div id="cards"></div>
    <details id="segments" hidden><summary></summary><div id="segment-cards"></div></details>
    <button id="load-more" hidden data-i18n="sideShowMore"></button>
    <details id="help">
      <summary data-i18n="sideFindMore"></summary>
      <p data-i18n="sideFindHint"></p>
      <div class="action-row">
        <button data-script="search.js" data-i18n="deepSearch"></button>
        <button data-script="catch.js" data-i18n="cacheCapture"></button>
      </div>
    </details>
  </main>
  <section id="playback-view" hidden>
    <button id="back-to-resources" class="text-btn" data-i18n="playbackBack"></button>
    <iframe id="sidebar-playback" title="Playback"></iframe>
  </section>
  <footer id="batch" hidden>
    <label><input type="checkbox" id="select-all"><span data-i18n="selectAll"></span></label>
    <button id="copy-selected" data-i18n="copy"></button>
    <button id="save-selected" class="primary" data-i18n="download"></button>
  </footer>
  <template id="card-template">
    <article class="resource">
      <div class="card-body">
        <div class="thumb" aria-hidden="true"><span></span></div>
        <div class="caption">
          <label class="select-resource" hidden><input type="checkbox" class="check"><span></span></label>
          <p class="resource-context"></p>
          <h3></h3>
          <span class="playback-quality" hidden></span>
        </div>
      </div>
      <div class="file-meta meta">
        <dl class="file-specs">
          <div><dt class="format-label"></dt><dd class="file-format"></dd></div>
          <div><dt class="size-label"></dt><dd class="file-size"></dd></div>
          <div class="codec-field" hidden><dt class="codec-label"></dt><dd>
            <span class="codec-value"></span>
            <label class="encoding-options select-shell" hidden>
              <span class="encoding-current" aria-hidden="true"></span><select class="encoding"></select>
            </label>
          </dd></div>
        </dl>
        <div class="variant-controls" hidden>
          <label class="tier-field" hidden><span data-i18n="sideTier"></span><span class="quality-value"></span>
            <span class="tier-select select-shell" hidden><span class="tier-current" aria-hidden="true"></span><select class="quality-tier" hidden></select></span>
          </label>
          <label class="version-field" hidden><span data-i18n="sideVersion"></span><select class="quality" hidden></select></label>
          <span class="track-note" hidden></span>
        </div>
        <p class="tier-note" role="status" hidden></p>
      </div>
      <div class="action-row">
        <div class="split-download">
          <button class="download primary"></button>
          <details class="download-modes" hidden>
            <summary>▾</summary>
            <div class="menu"><button data-mode="audio"></button><button data-mode="video"></button></div>
          </details>
        </div>
        <button class="locate"></button>
        <button class="toggle-details text-btn" aria-expanded="false"></button>
      </div>
      <div class="details" hidden></div>
      <p class="download-state" role="status"></p>
    </article>
  </template>
  <template id="player-template">
    <article class="resource" data-kind="video" data-player-only="true">
      <div class="card-body">
        <div class="thumb" aria-hidden="true"></div>
        <div class="caption"><h3></h3><p class="meta"><span class="playback-quality" hidden></span><span class="file-meta"></span></p></div>
      </div>
      <div class="action-row">
        <button class="locate"></button>
        <button class="toggle-details text-btn" aria-expanded="false"></button>
      </div>
      <div class="details" hidden></div>
    </article>
  </template>
</body>
</html>
